version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Patch and minor bumps arrive grouped so the queue is one PR a week rather
    # than fifteen; majors come separately because they need reading.
    groups:
      backend-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /backend/admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      admin-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    labels: [dependencies, admin]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    labels: [dependencies, frontend]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
